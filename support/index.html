<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="BaseballCam support center: recording, live baseball scoreboard, video saving, FAQs and contact information.">
<title>BaseballCam | Support</title>
<style>
:root{color-scheme:light;--navy:#14253c;--blue:#1769c2;--line:#e3e8ef;--muted:#526174}*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#1a2635;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans JP",sans-serif;line-height:1.7}header{background:var(--navy);color:white;padding:36px 20px}header .inner,main,footer .inner{max-width:860px;margin:auto}h1{margin:0;font-size:2rem;letter-spacing:-.03em}header p{margin:5px 0 20px;color:#dbe6f5}.langs{display:flex;gap:8px;flex-wrap:wrap}.langs button{cursor:pointer;border:1px solid #8297af;background:transparent;color:white;padding:8px 15px;border-radius:999px;font-size:14px}.langs button[aria-pressed=true]{background:white;color:var(--navy);font-weight:700}main{padding:24px 18px 42px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:24px;margin-bottom:18px;box-shadow:0 2px 9px #14253c08}h2{margin:0 0 12px;font-size:1.3rem}ol{padding-left:23px}li{margin:7px 0}details{border-top:1px solid var(--line);padding:13px 0}summary{cursor:pointer;font-weight:600}details p{margin:9px 0 2px;color:var(--muted)}a{color:var(--blue);overflow-wrap:anywhere}.note{font-size:.93rem;color:var(--muted)}footer{background:#e9eef4;padding:20px;color:var(--muted);font-size:.9rem}footer a{color:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #ffb84c;outline-offset:3px}@media(max-width:500px){h1{font-size:1.7rem}.card{padding:19px}}
</style>
</head>
<body>
<header><div class="inner"><h1>⚾ BaseballCam</h1><p id="tagline"></p><nav class="langs" aria-label="Language"><button type="button" data-lang="zh-Hant">繁體中文</button><button type="button" data-lang="en">English</button><button type="button" data-lang="ja">日本語</button></nav></div></header>
<main>
<section class="card"><h2 id="welcomeTitle"></h2><p id="welcome"></p></section>
<section class="card"><h2 id="guideTitle"></h2><ol id="guide"></ol><p class="note" id="guideNote"></p></section>
<section class="card"><h2 id="faqTitle"></h2><div id="faq"></div></section>
<section class="card"><h2 id="contactTitle"></h2><p id="contactText"></p><p><a href="mailto:lerfula@gmail.com?subject=BaseballCam%20Support">lerfula@gmail.com</a></p><p class="note" id="contactNote"></p></section>
<section class="card"><h2 id="privacyTitle"></h2><p id="privacyText"></p><a id="privacyLink" href="../"></a></section>
</main>
<footer><div class="inner">© 2026 Chen Bao-Cheng · BaseballCam</div></footer>
<script>
const translations={
'zh-Hant':{
tagline:'棒球錄影與即時計分｜使用者支援中心',welcomeTitle:'歡迎使用 BaseballCam',welcome:'BaseballCam 讓你在錄製棒球比賽的同時更新比分、局數、好壞球、出局數及壘包狀態，並將計分板合成至錄製影片。',guideTitle:'快速使用說明',guide:['開啟 BaseballCam，依提示允許使用相機及麥克風。','設定球隊名稱及先攻、後攻等比賽資訊。','開始錄影，並在比賽過程中操作計分板。','依需要使用鏡頭縮放、暫停及繼續錄影。','結束錄影後確認影片是否已儲存至照片圖庫。'],guideNote:'部分鏡頭倍率取決於裝置硬體；沒有超廣角鏡頭的裝置可能無法使用 0.5X。',faqTitle:'常見問題',faq:[['為什麼 0.5X 按鈕無法使用？','部分 iPhone 或 iPad 沒有超廣角鏡頭。若硬體不支援，0.5X 按鈕可能呈現停用狀態。'],['找不到錄製的影片怎麼辦？','請確認已允許 BaseballCam 存取照片圖庫，並檢查「照片」App。若仍找不到，請提供裝置型號、iOS 版本及操作步驟。'],['如何切換語言？','可在 App 內選擇繁體中文、English、日本語，或使用跟隨系統語言的選項。'],['錄影中斷或 APP 異常怎麼辦？','請確認裝置剩餘儲存空間、電量及溫度。若問題持續，請透過下方電子郵件回報。']],contactTitle:'聯絡與問題回報',contactText:'遇到操作問題或有改善建議，歡迎來信。',contactNote:'建議附上裝置型號、iOS 版本、BaseballCam 版本、問題發生步驟；請勿寄送不必要的個人資料或私人影片。',privacyTitle:'隱私權政策',privacyText:'了解 BaseballCam 的資料與隱私權處理方式。',privacyLink:'查看隱私權政策'},
en:{tagline:'Baseball recording and live scorekeeping | Support',welcomeTitle:'Welcome to BaseballCam',welcome:'BaseballCam lets you record baseball games while updating scores, innings, balls, strikes, outs, and base runners. The scoreboard is embedded into the recorded video.',guideTitle:'Quick Start',guide:['Open BaseballCam and allow camera and microphone access when prompted.','Set team names and home/away information.','Start recording and update the scoreboard during the game.','Use zoom, pause, and resume as needed.','After stopping the recording, check the Photos app for your video.'],guideNote:'Available camera zoom levels depend on your device. Devices without an ultra-wide camera may not support 0.5X.',faqTitle:'Frequently Asked Questions',faq:[['Why is the 0.5X button disabled?','Some iPhone and iPad models do not have an ultra-wide camera. The 0.5X option may be unavailable on these devices.'],['Where are my recorded videos?','Check that BaseballCam has permission to save to Photos, then look in the Photos app. If the video is missing, contact us with your device model, iOS version, and steps taken.'],['How do I change the language?','Select Traditional Chinese, English, Japanese, or the system language option within the app.'],['What if recording stops or the app behaves unexpectedly?','Check available storage, battery level, and device temperature. If the issue persists, email us using the address below.']],contactTitle:'Contact & Feedback',contactText:'Questions, bug reports, and feature suggestions are welcome.',contactNote:'Please include your device model, iOS version, BaseballCam version, and steps to reproduce the issue. Avoid sending unnecessary personal information or private videos.',privacyTitle:'Privacy Policy',privacyText:'Learn how BaseballCam handles data and privacy.',privacyLink:'View Privacy Policy'},
ja:{tagline:'野球の試合撮影とリアルタイムスコア記録｜サポート',welcomeTitle:'BaseballCam サポートへようこそ',welcome:'BaseballCam は、野球の試合を撮影しながら得点、イニング、ボール、ストライク、アウト、走者の状況を更新できるアプリです。スコアボードは録画映像に合成されます。',guideTitle:'基本的な使い方',guide:['BaseballCam を起動し、カメラとマイクの使用を許可します。','チーム名と先攻・後攻などを設定します。','録画を開始し、試合の進行に合わせてスコアボードを更新します。','必要に応じてズーム、一時停止、再開を操作します。','録画終了後、「写真」アプリに動画が保存されているか確認します。'],guideNote:'利用できるズーム倍率は端末のカメラ性能によって異なります。超広角カメラがない端末では 0.5X を使用できない場合があります。',faqTitle:'よくある質問',faq:[['0.5X ボタンが使えないのはなぜですか？','一部の iPhone・iPad には超広角カメラがありません。その場合、0.5X は無効になることがあります。'],['録画した動画が見つかりません。','写真ライブラリへの保存が許可されているか確認し、「写真」アプリをお調べください。見つからない場合は、端末名・iOS バージョン・操作手順をお知らせください。'],['言語を変更するには？','アプリ内で繁体字中国語、英語、日本語、またはシステム設定に従う項目を選択できます。'],['録画が止まる、アプリの動作がおかしい場合は？','端末の空き容量、バッテリー残量、温度をご確認ください。改善しない場合は、下記メールアドレスまでご連絡ください。']],contactTitle:'お問い合わせ・不具合報告',contactText:'ご質問、不具合の報告、改善のご提案はメールでお寄せください。',contactNote:'端末名、iOS バージョン、BaseballCam のバージョン、再現手順をお知らせください。不要な個人情報やプライベート動画の送信はお控えください。',privacyTitle:'プライバシーポリシー',privacyText:'BaseballCam におけるデータとプライバシーの取り扱いについてご確認いただけます。',privacyLink:'プライバシーポリシーを見る'}
};
function setLanguage(lang){if(!translations[lang])lang='en';const t=translations[lang];document.documentElement.lang=lang;for(const id of ['tagline','welcomeTitle','welcome','guideTitle','guideNote','faqTitle','contactTitle','contactText','contactNote','privacyTitle','privacyText','privacyLink'])document.getElementById(id).textContent=t[id];const guide=document.getElementById('guide');guide.replaceChildren();t.guide.forEach(s=>{const li=document.createElement('li');li.textContent=s;guide.append(li)});const faq=document.getElementById('faq');faq.replaceChildren();t.faq.forEach(([q,a])=>{const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('p');s.textContent=q;p.textContent=a;d.append(s,p);faq.append(d)});document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));try{localStorage.setItem('baseballcam-support-language',lang)}catch(e){}}
let lang='en';try{lang=localStorage.getItem('baseballcam-support-language')||''}catch(e){}if(!lang){const prefs=navigator.languages||[navigator.language];lang=prefs.find(l=>l.toLowerCase().startsWith('zh'))?'zh-Hant':prefs.find(l=>l.toLowerCase().startsWith('ja'))?'ja':'en'}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLanguage(b.dataset.lang)));setLanguage(lang);
</script>
</body>
</html>
